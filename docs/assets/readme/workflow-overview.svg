<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">How cut-the-bs works</title>
  <desc id="desc">Five-step workflow from base data to focused document outputs: capture data, choose a role lens, cut irrelevant content, generate documents, and iterate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="rail" x1="94" y1="0" x2="1186" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-30%" width="180%" height="190%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { fill:#0F172A; font-family:"Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif; font-size:48px; font-weight:700; }
      .subtitle { fill:#334155; font-family:"Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif; font-size:23px; font-weight:500; }
      .step-title { fill:#0F172A; font-family:"Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif; font-size:30px; font-weight:700; }
      .step-body { fill:#475569; font-family:"Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif; font-size:18px; font-weight:500; }
      .node-text { fill:#0F172A; font-family:"Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif; font-size:18px; font-weight:700; text-anchor:middle; dominant-baseline:middle; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <text class="title" x="68" y="86">How cut-the-bs works</text>
  <text class="subtitle" x="68" y="126">A clear five-step flow to cut the unimportant bullshit and show the real you.</text>

  <line x1="94" y1="594" x2="1186" y2="594" stroke="url(#rail)" stroke-width="8" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="52" y="178" width="220" height="340" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="52" y="178" width="220" height="10" rx="18" fill="#0EA5E9"/>
  </g>
  <text class="step-title" x="72" y="252">Capture</text>
  <text class="step-title" x="72" y="288">base data</text>
  <text class="step-body" x="72" y="342">Keep profile, work history,</text>
  <text class="step-body" x="72" y="370">wins, and skills in one</text>
  <text class="step-body" x="72" y="398">reusable source of truth.</text>
  <line x1="162" y1="518" x2="162" y2="576" stroke="#94A3B8" stroke-width="3"/>
  <circle cx="162" cy="594" r="18" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="4"/>
  <text class="node-text" x="162" y="594">1</text>

  <g filter="url(#shadow)">
    <rect x="292" y="178" width="220" height="340" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="292" y="178" width="220" height="10" rx="18" fill="#06B6D4"/>
  </g>
  <text class="step-title" x="312" y="252">Choose</text>
  <text class="step-title" x="312" y="288">a role lens</text>
  <text class="step-body" x="312" y="342">Select what is relevant</text>
  <text class="step-body" x="312" y="370">for this target role and</text>
  <text class="step-body" x="312" y="398">de-emphasize the rest.</text>
  <line x1="402" y1="518" x2="402" y2="576" stroke="#94A3B8" stroke-width="3"/>
  <circle cx="402" cy="594" r="18" fill="#FFFFFF" stroke="#06B6D4" stroke-width="4"/>
  <text class="node-text" x="402" y="594">2</text>

  <g filter="url(#shadow)">
    <rect x="532" y="178" width="220" height="340" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="532" y="178" width="220" height="10" rx="18" fill="#14B8A6"/>
  </g>
  <text class="step-title" x="552" y="252">Cut irrelevant</text>
  <text class="step-title" x="552" y="288">content</text>
  <text class="step-body" x="552" y="342">Trim generic bullets and</text>
  <text class="step-body" x="552" y="370">fluff so hiring teams see</text>
  <text class="step-body" x="552" y="398">your strongest signal fast.</text>
  <line x1="642" y1="518" x2="642" y2="576" stroke="#94A3B8" stroke-width="3"/>
  <circle cx="642" cy="594" r="18" fill="#FFFFFF" stroke="#14B8A6" stroke-width="4"/>
  <text class="node-text" x="642" y="594">3</text>

  <g filter="url(#shadow)">
    <rect x="772" y="178" width="220" height="340" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="772" y="178" width="220" height="10" rx="18" fill="#22C55E"/>
  </g>
  <text class="step-title" x="792" y="252">Generate</text>
  <text class="step-title" x="792" y="288">documents</text>
  <text class="step-body" x="792" y="342">Create resume, cover</text>
  <text class="step-body" x="792" y="370">letter, or both from the</text>
  <text class="step-body" x="792" y="398">same focused dataset.</text>
  <line x1="882" y1="518" x2="882" y2="576" stroke="#94A3B8" stroke-width="3"/>
  <circle cx="882" cy="594" r="18" fill="#FFFFFF" stroke="#22C55E" stroke-width="4"/>
  <text class="node-text" x="882" y="594">4</text>

  <g filter="url(#shadow)">
    <rect x="1012" y="178" width="220" height="340" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="1012" y="178" width="220" height="10" rx="18" fill="#F59E0B"/>
  </g>
  <text class="step-title" x="1032" y="252">Review and</text>
  <text class="step-title" x="1032" y="288">iterate</text>
  <text class="step-body" x="1032" y="342">Version outputs, refine</text>
  <text class="step-body" x="1032" y="370">what worked, and adapt</text>
  <text class="step-body" x="1032" y="398">quickly for the next role.</text>
  <line x1="1122" y1="518" x2="1122" y2="576" stroke="#94A3B8" stroke-width="3"/>
  <circle cx="1122" cy="594" r="18" fill="#FFFFFF" stroke="#F59E0B" stroke-width="4"/>
  <text class="node-text" x="1122" y="594">5</text>
</svg>
