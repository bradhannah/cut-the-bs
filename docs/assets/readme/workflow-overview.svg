<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">cut-the-bs workflow overview</title>
  <desc id="desc">Five-step visual workflow: profile data, role lens, application tracking, document generation, and export history.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1F2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22C55E"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <text x="72" y="82" fill="#F9FAFB" font-family="Segoe UI, Inter, sans-serif" font-size="42" font-weight="700">How cut-the-bs works</text>
  <text x="72" y="122" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="21">A practical loop for tailoring resumes and cover letters per application.</text>

  <line x1="122" y1="386" x2="1158" y2="386" stroke="url(#line)" stroke-width="6" stroke-linecap="round"/>

  <g>
    <rect x="72" y="214" width="214" height="318" rx="16" fill="url(#card)" stroke="#334155"/>
    <circle cx="106" cy="248" r="18" fill="#22C55E"/>
    <text x="99" y="255" fill="#052E16" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700">1</text>
    <text x="94" y="292" fill="#F3F4F6" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="700">Capture</text>
    <text x="94" y="322" fill="#F3F4F6" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="700">your base data</text>
    <text x="94" y="364" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="17">Profile, work history,</text>
    <text x="94" y="390" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="17">skills, certifications,</text>
    <text x="94" y="416" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="17">and reusable summaries.</text>
  </g>

  <g>
    <rect x="318" y="174" width="214" height="318" rx="16" fill="url(#card)" stroke="#334155"/>
    <circle cx="352" cy="208" r="18" fill="#22C55E"/>
    <text x="345" y="215" fill="#052E16" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700">2</text>
    <text x="340" y="252" fill="#F3F4F6" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="700">Create role</text>
    <text x="340" y="282" fill="#F3F4F6" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="700">focused lenses</text>
    <text x="340" y="324" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="17">Save selection presets</text>
    <text x="340" y="350" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="17">for leadership,</text>
    <text x="340" y="376" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="17">hands-on roles, and</text>
    <text x="340" y="402" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="17">domain-specific targets.</text>
  </g>

  <g>
    <rect x="564" y="214" width="214" height="318" rx="16" fill="url(#card)" stroke="#334155"/>
    <circle cx="598" cy="248" r="18" fill="#22C55E"/>
    <text x="591" y="255" fill="#052E16" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700">3</text>
    <text x="586" y="292" fill="#F3F4F6" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="700">Track each</text>
    <text x="586" y="322" fill="#F3F4F6" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="700">application</text>
    <text x="586" y="364" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="17">Store company, role,</text>
    <text x="586" y="390" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="17">status, fit signal, and</text>
    <text x="586" y="416" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="17">context notes in one view.</text>
  </g>

  <g>
    <rect x="810" y="174" width="214" height="318" rx="16" fill="url(#card)" stroke="#334155"/>
    <circle cx="844" cy="208" r="18" fill="#22C55E"/>
    <text x="837" y="215" fill="#052E16" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700">4</text>
    <text x="832" y="252" fill="#F3F4F6" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="700">Generate docs</text>
    <text x="832" y="282" fill="#F3F4F6" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="700">from the app</text>
    <text x="832" y="324" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="17">Resume only, cover</text>
    <text x="832" y="350" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="17">letter only, or both.</text>
    <text x="832" y="376" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="17">Overwrite latest or</text>
    <text x="832" y="402" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="17">create a new version.</text>
  </g>

  <g>
    <rect x="1056" y="214" width="214" height="318" rx="16" fill="url(#card)" stroke="#334155"/>
    <circle cx="1090" cy="248" r="18" fill="#22C55E"/>
    <text x="1083" y="255" fill="#052E16" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700">5</text>
    <text x="1078" y="292" fill="#F3F4F6" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="700">Review and</text>
    <text x="1078" y="322" fill="#F3F4F6" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="700">iterate fast</text>
    <text x="1078" y="364" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="17">Open exported PDFs,</text>
    <text x="1078" y="390" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="17">capture version history,</text>
    <text x="1078" y="416" fill="#9CA3AF" font-family="Segoe UI, Inter, sans-serif" font-size="17">and adjust for next role.</text>
  </g>
</svg>
