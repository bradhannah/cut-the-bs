name: Release macOS App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Validate via Makefile
        run: |
          make test
          make frontend-check

      - name: Build and package macOS release
        run: make release-macos

      - name: Upload build artifact (manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: cut-the-bs-macos-universal
          path: |
            dist/cut-the-bs-macos-universal.tar.gz
            dist/cut-the-bs-macos-universal.tar.gz.sha256

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cut-the-bs-macos-universal.tar.gz
            dist/cut-the-bs-macos-universal.tar.gz.sha256
          generate_release_notes: true
